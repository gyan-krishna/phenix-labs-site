<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Job application form blueprint</title>
  </head>
  <body>
    <!-- Netlify discovers this hidden blueprint during deployment. Keep field names synchronized with JobApplicationForm and the Edge guard. -->
    <form
      name="job-application"
      method="POST"
      enctype="multipart/form-data"
      data-netlify="true"
      data-netlify-honeypot="application-bot-field"
    >
      <input type="hidden" name="form-name" value="job-application" />
      <p hidden><label>Do not fill this field <input name="application-bot-field" type="text" /></label></p>
      <!-- First visible text field makes Netlify's application list easy to identify by role. -->
      <label>Job title <input name="jobTitle" type="text" /></label>
      <input name="applicationId" type="hidden" />
      <input name="jobId" type="hidden" />
      <input name="retentionDays" type="hidden" />
      <label>Full name <input name="name" type="text" /></label>
      <label>Email <input name="email" type="email" /></label>
      <label>Phone <input name="phone" type="tel" /></label>
      <label>Location <input name="location" type="text" /></label>
      <label>Experience <input name="experienceYears" type="text" /></label>
      <label>Notice period (days) <input name="noticePeriodDays" type="number" min="0" /></label>
      <label>Current company <input name="currentCompany" type="text" /></label>
      <label>Compensation expectation <input name="compensationExpectation" type="text" /></label>
      <label>LinkedIn <input name="linkedinUrl" type="url" /></label>
      <label>Portfolio <input name="portfolioUrl" type="url" /></label>
      <label>Cover letter <textarea name="coverLetter"></textarea></label>
      <label>Resume <input name="resume" type="file" accept="application/pdf,.pdf" /></label>
      <label>Privacy consent <input name="privacyConsent" type="checkbox" value="yes" /></label>
    </form>
  </body>
</html>
